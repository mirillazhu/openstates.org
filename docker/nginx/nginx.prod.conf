user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    uwsgi_cache_path /tmp/uwsgi-cache levels=1:2 keys_zone=my_cache:10m max_size=2g inactive=60m use_temp_path=off;

    map $request_uri $limit_key {
        ~^/static/  "";
        ~^/media/   "";
        default     $binary_remote_addr;
    }   

    limit_req_zone $limit_key zone=general:10m rate=30r/s;

    # redirect http to https
    server {
        listen 80;
        server_name demo.openstatesforjustice.org openstatesforjustice.org www.openstatesforjustice.org;
        return 301 https://demo.openstatesforjustice.org$request_uri;
    }

    # redirect root domain https to subdomain
    server {
        listen 443 ssl;
        server_name openstatesforjustice.org www.openstatesforjustice.org;

        ssl_certificate /etc/letsencrypt/live/demo.openstatesforjustice.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/demo.openstatesforjustice.org/privkey.pem;

        return 301 https://demo.openstatesforjustice.org$request_uri;
    }

    # main web server
    server {
        listen 443 ssl;
        server_name demo.openstatesforjustice.org;

        ssl_certificate /etc/letsencrypt/live/demo.openstatesforjustice.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/demo.openstatesforjustice.org/privkey.pem;

        limit_req zone=general burst=50 nodelay;

        include /etc/nginx/nginx.common.conf;
    }
}
