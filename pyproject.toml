[tool.poetry]
name = "openstates.org"
version = "3.4"
description = ""
authors = ["James Turk <dev@jamesturk.net>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
django = "5.2.19"
django-allauth = "^0.57.0"
django-csp = "^4.0"
django-recaptcha = "^4.1.0"
django-redis = "^7.0.0"
dj-database-url = "^3.0.0"
whitenoise = "^5.2"
pybase62 = "^0.4.3"
python-dateutil = "^2.8"
boto3 = "^1.9"
newrelic = "^12.0.0"
structlog = "^20.1.0"
snowballstemmer = "^3.0.1"
openstates = {git = "https://github.com/mirillazhu/openstates-core", rev = "e3e7e75bbde8079878a553cb3e6a53c5a41bbe69"}

[tool.poetry.group.dev.dependencies]
django-upgrade = "^1.32.0"
pytest = "^8.4.2"
pytest-django = "4.12.0"
flake8 = "^3.7"
freezegun = "^1.5"
ipython = "^7.31"
invoke = "^1.5.0"
black = "^22.3.0"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.black]
extend-exclude = '''
/(
  | openstates-postgres
  | node_modules
)/
'''
